# =============================================================================
# monitoring/prometheus.yml — Configuration de collecte des métriques
# =============================================================================
# Prometheus scrape les métriques de l'API FastAPI toutes les 15 secondes
# via l'endpoint /metrics exposé par prometheus-fastapi-instrumentator.
# =============================================================================

global:
  scrape_interval: 15s          # Fréquence de collecte des métriques
  evaluation_interval: 15s      # Fréquence d'évaluation des règles d'alertes
  scrape_timeout: 10s

scrape_configs:

  # --- FastAPI Backend ---
  - job_name: 'fastapi_backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # --- Prometheus lui-même ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
